
[project]
name = "http-headers-scanner"
version = "1.0.0"
description = "Scan a URL for HTTP security headers and grade it A-F."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
headers = "http_headers_scanner:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["http_headers_scanner"]